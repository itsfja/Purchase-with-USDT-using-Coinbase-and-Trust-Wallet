<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360"><rect x="4" y="4" width="592" height="352" rx="22" fill="#fbf5e6" stroke="#24395c" stroke-width="4"/><text x="300" y="45" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#24395c" text-anchor="middle">Does the road match the address?</text><rect x="40" y="70" width="520" height="210" rx="12" fill="#ffffff" stroke="#24395c" stroke-width="3"/><text x="160" y="110" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#24395c" text-anchor="middle">Starts with</text><text x="420" y="110" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#24395c" text-anchor="middle">Road</text><text x="160" y="150" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" fill="#24395c" text-anchor="middle">T (34 letters)</text><text x="420" y="150" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" fill="#d94a38" text-anchor="middle">Tron: ask for another</text><text x="160" y="190" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" fill="#24395c" text-anchor="middle">0x (42 letters)</text><text x="420" y="190" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" fill="#24395c" text-anchor="middle">Ethereum: ask to be sure</text><text x="160" y="230" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" fill="#24395c" text-anchor="middle">anything else</text><text x="420" y="230" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" fill="#24395c" text-anchor="middle">Solana</text><text x="300" y="320" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#d94a38" text-anchor="middle">If it does not match: do not send.</text></svg>