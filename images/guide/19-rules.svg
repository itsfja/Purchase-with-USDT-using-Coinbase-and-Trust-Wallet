<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360"><rect x="4" y="4" width="592" height="352" rx="22" fill="#fbf5e6" stroke="#24395c" stroke-width="4"/><text x="300" y="50" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#24395c" text-anchor="middle">The rules</text><path d="M70 88 L77.7 96.8 L92.0 78.1" stroke="#4a8c5c" stroke-width="4.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="100" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#24395c" text-anchor="start">Not advice. You decide.</text><path d="M70 126 L77.7 134.8 L92.0 116.1" stroke="#4a8c5c" stroke-width="4.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="138" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#24395c" text-anchor="start">Never share your 12 words.</text><path d="M70 164 L77.7 172.8 L92.0 154.1" stroke="#4a8c5c" stroke-width="4.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="176" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#24395c" text-anchor="start">Copy, never type.</text><path d="M70 202 L77.7 210.8 L92.0 192.1" stroke="#4a8c5c" stroke-width="4.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="214" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#24395c" text-anchor="start">First four, last four.</text><path d="M70 240 L77.7 248.8 L92.0 230.1" stroke="#4a8c5c" stroke-width="4.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="252" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#24395c" text-anchor="start">Right road. Never Base.</text><path d="M70 278 L77.7 286.8 L92.0 268.1" stroke="#4a8c5c" stroke-width="4.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="11