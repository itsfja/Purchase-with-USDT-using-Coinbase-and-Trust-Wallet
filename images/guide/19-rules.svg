<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360"><rect x="4" y="4" width="592" height="352" rx="22" fill="#fbf5e6" stroke="#24395c" stroke-width="4"/><text x="300" y="50" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#24395c" text-anchor="middle">The rules</text><path d="M70 84 L77.0 92.0 L90.0 75.0" stroke="#4a8c5c" stroke-width="4.0" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="96" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#24395c" text-anchor="start">Not advice. You decide.</text><path d="M70 117 L77.0 125.0 L90.0 108.0" stroke="#4a8c5c" stroke-width="4.0" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="129" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#24395c" text-anchor="start">Never share your 12 words.</text><path d="M70 150 L77.0 158.0 L90.0 141.0" stroke="#4a8c5c" stroke-width="4.0" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="162" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#24395c" text-anchor="start">Copy, never type.</text><path d="M70 183 L77.0 191.0 L90.0 174.0" stroke="#4a8c5c" stroke-width="4.0" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="195" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#24395c" text-anchor="start">First four, last four.</text><path d="M70 216 L77.0 224.0 L90.0 207.0" stroke="#4a8c5c" stroke-width="4.0" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="228" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#24395c" text-anchor="start">Right road. Never Base.</text><path d="M70 249 L77.0 257.0 L90.0 240.0" stroke="#4a8c5c" stroke-width="4.0" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="261" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#24395c" text-anchor="start">Pay from your purse, not the shop.</text><path d="M70 282 L77.0 290.0 L90.0 273.0" stroke="#4a8c5c" stroke-width="4.0" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="294" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#24395c" text-anchor="start">A little bit first.</text><path d="M70 315 L77.0 323.0 L90.0 306.0" stroke="#4a8c5c" stroke-width="4.0" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="327" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" fill="#24395c" text-anchor="start">Wait, then tick.</text></svg>