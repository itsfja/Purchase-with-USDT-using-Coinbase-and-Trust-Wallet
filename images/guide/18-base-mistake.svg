<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360"><rect x="4" y="4" width="592" height="352" rx="22" fill="#fbf5e6" stroke="#24395c" stroke-width="4"/><line x1="140" y1="110" x2="140" y2="220" stroke="#8a8f98" stroke-width="6"/><polygon points="195.4,133.0 163.0,165.4 117.0,165.4 84.6,133.0 84.6,87.0 117.0,54.6 163.0,54.6 195.4,87.0" fill="#d94a38" stroke="#ffffff" stroke-width="4"/><text x="140" y="123.2" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">BASE</text><text x="400" y="120" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#24395c" text-anchor="middle">Wrong road?</text><text x="400" y="160" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" fill="#24395c" text-anchor="middle">If it went to your own purse,</text><text x="400" y="185" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" fill="#24395c" text-anchor="middle">it is usually still there.</text><text x="400" y="235" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#d94a38" text-anchor="middle">Anyone who offers</text><text x="400" y="260" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#d94a38" text-anchor="middle">to get it back for money</text><text x="400" y="285" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#d94a38" text-anchor="middle">is a thief.</text></svg>